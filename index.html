 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Reproducible - Grupo 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>¡Bienvenido al Proyecto Reproducible del Grupo 5!</h1>
    <p>Este repositorio demuestra el uso básico de Git, GitHub y la documentación en un README.md.</p>
    <button onclick="saludar()">Haz clic aquí</button>
    <p id="mensaje" style="margin-top: 20px; font-weight: bold; color: green;"></p>

    <script>
        function saludar() {
            document.getElementById("mensaje").innerText = "¡El proyecto se ejecutó correctamente de forma local!";
        }
    </script>
</body>
</html>
